name: Tests

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # PySide6's wheel bundles Qt itself, but Qt's xcb/offscreen platform
      # plugins still link against these system libraries at runtime.
      - name: Install Linux Qt runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libegl1 libxkbcommon0 libxcb-cursor0 libxcb-icccm4 \
            libxcb-image0 libxcb-keysyms1 libxcb-randr0 \
            libxcb-render-util0 libxcb-shape0

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          # CPU wheels: this runner has no GPU, and --extra-index-url (not
          # --index-url) is required since facenet-pytorch only exists on
          # PyPI, not on download.pytorch.org's index -- see the comment in
          # requirements-recognition.txt.
          pip install --extra-index-url https://download.pytorch.org/whl/cpu -r requirements-recognition.txt
          # The quality extra too, or its tests silently skip and the feature
          # goes untested -- which is how a release shipped without it.
          pip install -r requirements-quality.txt

      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -v
