name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch: {}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            asset_name: Tamis-linux-x86_64.tar.gz
          - os: windows-latest
            asset_name: Tamis-windows-x86_64.zip
          - os: macos-latest
            asset_name: Tamis-macos-arm64.zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # PySide6's wheel bundles Qt itself, but Qt's xcb platform plugin still
      # links against these system libraries at runtime.
      - name: Install Linux Qt runtime dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libegl1 libxkbcommon0 libxcb-cursor0 libxcb-icccm4 \
            libxcb-image0 libxcb-keysyms1 libxcb-randr0 \
            libxcb-render-util0 libxcb-shape0

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Build executable
        run: pyinstaller tamis.spec --noconfirm

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          chmod +x dist/Tamis
          tar -C dist -czf ${{ matrix.asset_name }} Tamis

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path dist/Tamis.exe -DestinationPath ${{ matrix.asset_name }}

      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: |
          chmod +x dist/Tamis
          ditto -c -k dist/Tamis ${{ matrix.asset_name }}

      - name: Check the packaged asset size stays reasonable
        shell: bash
        run: |
          size_bytes=$(stat -c%s "${{ matrix.asset_name }}" 2>/dev/null || stat -f%z "${{ matrix.asset_name }}")
          size_mb=$((size_bytes / 1024 / 1024))
          echo "Packaged asset size: ${size_mb}MB"
          # The portable build deliberately excludes face recognition
          # (requirements-dev.txt never installs torch/facenet-pytorch,
          # ~2GB+ of mostly CUDA libraries) -- true today by omission, but
          # previously unasserted. This budget sits well above a normal
          # PySide6+Pillow build but far below what a torch-inclusive one
          # would produce, so a future dependency change accidentally
          # pulling recognition deps into the frozen build fails loudly
          # here instead of silently shipping a multi-GB release asset.
          if [ "$size_mb" -gt 500 ]; then
            echo "ERROR: packaged asset is ${size_mb}MB, over the 500MB budget -- did a recognition dependency (torch/CUDA) get bundled?"
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: ${{ matrix.asset_name }}

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Flatten artifacts
        run: |
          mkdir -p release
          find artifacts -type f -exec mv {} release/ \;

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
