name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch: {}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # "lean": no face recognition, smallest/fastest download.
          # "cpu": face recognition, CPU-only PyTorch build.
          #
          # There is deliberately no "gpu" (CUDA) variant here. GPU users are
          # served by installing from source instead (./install.sh already
          # auto-detects nvidia-smi and pulls the CUDA wheels) -- see the
          # README's "Standalone executables" section. Two independent reasons
          # a packaged CUDA build doesn't work as a release asset:
          #
          #   1. Too big to publish. A real CUDA-enabled PyInstaller build on
          #      Linux is ~2.6GB, and GitHub rejects any release asset over
          #      2GiB. The v2.1.0 run hit exactly this: all eight build legs
          #      succeeded, then the release job failed uploading that one
          #      asset, leaving 2.1.0 published with the other seven.
          #   2. Silently wrong on Windows. The CUDA wheels only live on
          #      download.pytorch.org, not PyPI -- and PyPI's Windows torch
          #      wheel is CPU-only. A plain `pip install torch` therefore
          #      produced a *CPU* build labeled "-recognition-gpu" (v2.1.0's
          #      two Windows recognition assets came out 535 bytes apart),
          #      so anyone who chose it for GPU support got CPU inference
          #      with no indication anything was wrong.
          - os: ubuntu-latest
            variant: lean
            asset_name: Tamis-linux-x86_64.tar.gz
          - os: ubuntu-latest
            variant: cpu
            asset_name: Tamis-linux-x86_64-recognition-cpu.tar.gz
          - os: windows-latest
            variant: lean
            asset_name: Tamis-windows-x86_64.zip
          - os: windows-latest
            variant: cpu
            asset_name: Tamis-windows-x86_64-recognition-cpu.zip
          - os: macos-latest
            variant: lean
            asset_name: Tamis-macos-arm64.zip
          - os: macos-latest
            variant: cpu
            asset_name: Tamis-macos-arm64-recognition-cpu.zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # PySide6's wheel bundles Qt itself, but Qt's xcb platform plugin still
      # links against these system libraries at runtime.
      - name: Install Linux Qt runtime dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libegl1 libxkbcommon0 libxcb-cursor0 libxcb-icccm4 \
            libxcb-image0 libxcb-keysyms1 libxcb-randr0 \
            libxcb-render-util0 libxcb-shape0

      - name: Install build dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          if [ "${{ matrix.variant }}" = "cpu" ]; then
            pip install --extra-index-url https://download.pytorch.org/whl/cpu -r requirements-recognition.txt
          fi

      - name: Build executable
        run: pyinstaller tamis.spec --noconfirm

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          chmod +x dist/Tamis
          tar -C dist -czf ${{ matrix.asset_name }} Tamis

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path dist/Tamis.exe -DestinationPath ${{ matrix.asset_name }}

      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: |
          chmod +x dist/Tamis
          ditto -c -k dist/Tamis ${{ matrix.asset_name }}

      - name: Check the packaged asset size stays reasonable
        shell: bash
        run: |
          size_bytes=$(stat -c%s "${{ matrix.asset_name }}" 2>/dev/null || stat -f%z "${{ matrix.asset_name }}")
          size_mb=$((size_bytes / 1024 / 1024))
          echo "Packaged asset size: ${size_mb}MB (variant: ${{ matrix.variant }})"
          # Per-variant budget, so a future dependency change that bloats one
          # build fails loudly here instead of silently shipping an
          # oversized release asset.
          #
          # Both budgets are now derived from real published v2.1.0 assets
          # (the previous numbers were estimates written before any CI run of
          # these legs existed), taking the largest OS per variant and
          # allowing roughly 2x headroom for normal dependency growth:
          #   lean: linux 93MB, windows 61MB, macos 43MB  -> 200MB budget.
          #     Also the check that catches face recognition accidentally
          #     leaking into this variant, which is the whole point of it
          #     existing -- anything torch-inclusive lands far above 200MB.
          #   cpu:  linux 336MB, windows 235MB, macos 196MB -> 700MB budget.
          #
          # Keep every budget well under 2048 (GitHub rejects release assets
          # over 2GiB). The old gpu budget was 3500MB, i.e. above a limit the
          # upload could never satisfy, so a ~2.6GB asset passed this check
          # and then failed to publish -- see the matrix comment above.
          case "${{ matrix.variant }}" in
            lean) budget_mb=200 ;;
            cpu)  budget_mb=700 ;;
          esac
          if [ "$size_mb" -gt "$budget_mb" ]; then
            echo "ERROR: packaged asset is ${size_mb}MB, over the ${budget_mb}MB budget for the '${{ matrix.variant }}' variant."
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: ${{ matrix.asset_name }}

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4  # for CHANGELOG.md, read by the step below

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Flatten artifacts
        run: |
          mkdir -p release
          find artifacts -type f -exec mv {} release/ \;

      # generate_release_notes alone produces a bare list of commit subjects,
      # which buries anything a user needs to know *before* upgrading (in
      # 2.2.0: a one-way sidecar format change, and the removal of the
      # -recognition-gpu assets). The changelog already says all of that in
      # prose, so use this tag's section as the release body and let the
      # generated commit list append below it.
      - name: Use this version's changelog section as the release body
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v want="## [$version]" '
            index($0, want) == 1 { found = 1; next }
            found && /^## \[/    { exit }
            found                { print }
          ' CHANGELOG.md > release-body.md
          # Fail loudly rather than publishing a release with an empty body:
          # it means the changelog was not updated for this tag.
          if [ ! -s release-body.md ]; then
            echo "ERROR: CHANGELOG.md has no '## [$version]' section for tag ${GITHUB_REF_NAME}." >&2
            exit 1
          fi
          echo "--- release body ---"
          cat release-body.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
          body_path: release-body.md
          generate_release_notes: true
